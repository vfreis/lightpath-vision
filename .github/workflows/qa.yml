name: QA
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm --workspace @lightpath/braciera-vision-api run typecheck
      - run: npm --workspace @lightpath/braciera-vision-api test
      - run: npm run hostinger:build
      - run: npm run hostinger:smoke
      - run: npm --workspace frontend run build
      - name: Secret scan guard
        run: |
          if grep -R --exclude-dir=node_modules --exclude='*.md' -nE 'sk-[A-Za-z0-9_-]{20,}' frontend api; then
            echo 'Possible OpenAI secret found in repository'; exit 1
          fi
